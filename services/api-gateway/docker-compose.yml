services:
  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    env_file: ../../.env
    environment:
      REDIS_URL: redis://gateway-redis:6379/0
      DATABASE_URL: postgresql+asyncpg://itinerary:itinerary@host.docker.internal:5432/itineraries
      AIRPORT_SERVICE_URL: http://host.docker.internal:8001
      ITINERARY_SERVICE_URL: http://host.docker.internal:8002
      REPORT_SERVICE_URL: http://host.docker.internal:8003
    ports: ["8000:8000"]
    depends_on:
      gateway-redis: {condition: service_healthy}
  gateway-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
