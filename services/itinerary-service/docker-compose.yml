# Uso: docker compose --env-file ../../.env up --build  (credenciales desde el .env de la raiz)
services:
  itinerary-service:
    build:
      context: ../..
      dockerfile: services/itinerary-service/Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-itinerary}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@itinerary-db:5432/${POSTGRES_DB:-itineraries}
      AIRPORT_SERVICE_URL: http://host.docker.internal:8001
    ports: ["8002:8000"]
    depends_on:
      itinerary-db: {condition: service_healthy}
  itinerary-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itinerary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-itineraries}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
