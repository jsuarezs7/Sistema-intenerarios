services:
  airport-service:
    build:
      context: ../..
      dockerfile: services/airport-service/Dockerfile
    env_file: ../../.env
    environment:
      REDIS_URL: redis://airport-redis:6379/0
    ports: ["8001:8000"]
    depends_on:
      airport-redis: {condition: service_healthy}
  airport-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
