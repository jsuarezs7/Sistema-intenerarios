sonar.projectKey=sistema-itinerarios
sonar.projectName=Sistema de Itinerarios
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12

# Cada microservicio es un modulo con sus propias pruebas y cobertura.
sonar.modules=airport-service,itinerary-service,api-gateway,notification-function,report-function,shared,frontend

sonar.sources=app
sonar.tests=tests
sonar.exclusions=**/migrations/**,**/__pycache__/**

airport-service.sonar.projectBaseDir=services/airport-service
airport-service.sonar.python.coverage.reportPaths=/usr/src/reports/airport-service/coverage.xml
airport-service.sonar.python.xunit.reportPath=/usr/src/reports/airport-service/test-results.xml
itinerary-service.sonar.projectBaseDir=services/itinerary-service
itinerary-service.sonar.python.coverage.reportPaths=/usr/src/reports/itinerary-service/coverage.xml
itinerary-service.sonar.python.xunit.reportPath=/usr/src/reports/itinerary-service/test-results.xml
api-gateway.sonar.projectBaseDir=services/api-gateway
api-gateway.sonar.python.coverage.reportPaths=/usr/src/reports/api-gateway/coverage.xml
api-gateway.sonar.python.xunit.reportPath=/usr/src/reports/api-gateway/test-results.xml
notification-function.sonar.projectBaseDir=services/notification-function
notification-function.sonar.python.coverage.reportPaths=/usr/src/reports/notification-function/coverage.xml
notification-function.sonar.python.xunit.reportPath=/usr/src/reports/notification-function/test-results.xml
report-function.sonar.projectBaseDir=services/report-function
report-function.sonar.python.coverage.reportPaths=/usr/src/reports/report-function/coverage.xml
report-function.sonar.python.xunit.reportPath=/usr/src/reports/report-function/test-results.xml

shared.sonar.projectBaseDir=shared
shared.sonar.sources=.
shared.sonar.tests=
shared.sonar.exclusions=**/*.egg-info/**,**/__pycache__/**

frontend.sonar.projectBaseDir=frontend
frontend.sonar.sources=.
frontend.sonar.tests=
