[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itinerary-shared"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyJWT>=2.10,<3", "fastapi>=0.115,<1", "httpx>=0.28,<1", "python-json-logger>=3,<5", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "opentelemetry-instrumentation-fastapi>=0.51b0,<1", "opentelemetry-instrumentation-httpx>=0.51b0,<1"]

